<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sơ đồ CRM — kéo, đổi cỡ, chỉnh sửa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0f; --ink:#f2f2f4; --arrow:#6b7280; --label:#9aa0a8; --dash:#3d7ec0;
    --purple-bg:#3a2b6d; --purple-bd:#5b45a6; --purple-sub:#bcaef0;
    --blue-bg:#123b5e;   --blue-bd:#2076b8;   --blue-sub:#8fc4ec;
    --rust-bg:#5f2a18;   --rust-bd:#a04a2a;   --rust-sub:#e2a88f;
    --teal-bg:#0d4b39;   --teal-bd:#1a916c;   --teal-sub:#74dcae;
    --gray-bg:#333336;   --gray-bd:#6d6d74;   --gray-sub:#bcbcc2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:14px 20px;background:rgba(13,13,15,.85);backdrop-filter:blur(8px);border-bottom:1px solid #24242a}
  .toolbar .brand{font-weight:700;font-size:15px;margin-right:auto}
  .toolbar .brand small{display:block;font-weight:400;font-size:11.5px;color:var(--label)}
  button.tb{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:#1e1e24;
    border:1px solid #33333b;border-radius:8px;padding:8px 13px;cursor:pointer;transition:.14s}
  button.tb:hover{background:#2a2a33;border-color:#4a4a55}
  button.tb:focus-visible{outline:2px solid var(--blue-bd);outline-offset:2px}

  .legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:12px 20px 0;
    font-size:12.5px;color:var(--label)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
  .legend .flowdot{width:14px;height:0;border-top:2px solid var(--arrow)}
  .hint{color:var(--label);font-size:12px;text-align:center;padding:8px 20px 0}

  .stage{display:flex;justify-content:center;overflow:auto;padding:20px 16px 60px}
  .canvas{position:relative;width:820px;height:745px;flex:0 0 auto;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);
    background-size:20px 20px;border-radius:12px}
  .wires{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
  #layer{position:absolute;inset:0;z-index:1}

  .card{position:absolute;border-radius:11px;padding:12px 16px;border:1px solid;
    display:flex;flex-direction:column;justify-content:center;text-align:center;transition:box-shadow .15s}
  .card:hover{box-shadow:0 0 0 2px rgba(255,255,255,.08)}
  .c-purple{background:var(--purple-bg);border-color:var(--purple-bd)} .c-purple .s{color:var(--purple-sub)}
  .c-blue  {background:var(--blue-bg);  border-color:var(--blue-bd)}   .c-blue .s{color:var(--blue-sub)}
  .c-rust  {background:var(--rust-bg);  border-color:var(--rust-bd)}   .c-rust .s{color:var(--rust-sub)}
  .c-teal  {background:var(--teal-bg);  border-color:var(--teal-bd)}   .c-teal .s{color:var(--teal-sub)}
  .c-gray  {background:var(--gray-bg);  border-color:var(--gray-bd)}   .c-gray .s{color:var(--gray-sub)}
  .t{font-weight:700;font-size:14.5px;line-height:1.28;outline:none;border-radius:4px}
  .s{font-weight:400;font-size:12px;margin-top:3px;outline:none;border-radius:4px}
  [contenteditable]:focus{box-shadow:0 0 0 2px rgba(255,255,255,.3)}

  .drag-handle{position:absolute;top:5px;left:5px;width:21px;height:21px;display:flex;align-items:center;
    justify-content:center;font-size:12px;color:#fff;background:rgba(0,0,0,.34);
    border:1px solid rgba(255,255,255,.28);border-radius:6px;cursor:grab;opacity:0;transition:.14s;touch-action:none;user-select:none}
  .drag-handle:active{cursor:grabbing}
  .cc{position:absolute;top:5px;right:5px;width:21px;height:21px;padding:0;font-size:11px;line-height:1;
    color:#fff;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.28);border-radius:6px;cursor:pointer;opacity:0;transition:.14s}
  .cc:hover{background:rgba(0,0,0,.55)}
  a.cc{top:-10px;right:-10px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-weight:700;opacity:.85;background:#1e1e24;border-color:#5a5a66}
  a.cc:hover{opacity:1;background:#33333d;border-color:#8a8a99}
  .resize-handle{position:absolute;right:1px;bottom:1px;width:16px;height:16px;cursor:nwse-resize;opacity:0;
    transition:.14s;color:var(--label);display:flex;align-items:flex-end;justify-content:flex-end;touch-action:none}
  .card:hover .drag-handle,.card:hover .cc,.card:hover .resize-handle,
  .note:hover .drag-handle,.note:hover .resize-handle,.note:hover .del{opacity:1}

  .actor{position:absolute;width:120px;text-align:center}
  .actor-grip{display:inline-block;cursor:grab;touch-action:none}
  .actor-grip:active{cursor:grabbing}
  .an{font-weight:600;font-size:13px;margin-top:3px;outline:none;border-radius:4px}
  .ar{font-size:11px;color:var(--label);margin-top:1px;outline:none;border-radius:4px}

  .note{position:absolute;background:#1b1b21;border:1px dashed #4a4a55;border-radius:9px;padding:11px 13px;color:#e8e8ec;font-size:12.5px}
  .note .nt{outline:none;min-height:20px;line-height:1.4}
  .note .del{position:absolute;top:4px;right:4px;width:20px;height:20px;padding:0;font-size:10px;color:#fff;
    background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.25);border-radius:5px;cursor:pointer;opacity:0;transition:.14s}

  @media print{
    .toolbar,.legend,.hint,.drag-handle,.cc,.resize-handle,.del{display:none!important}
    .stage{padding:6px}.canvas{background:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="brand">Sơ đồ CRM<small>Kéo ⠿ để di chuyển · kéo góc để đổi cỡ · bấm chữ để sửa · bấm ↗ để mở tài liệu module</small></div>
    <button class="tb" id="addnote">＋ Ghi chú</button>
    <button class="tb" id="print">⤓ Lưu / In PDF</button>
    <button class="tb" id="reset">↺ Đặt lại</button>
  </div>
  <div class="legend">
    <span><i style="background:#e0954a"></i>Customer</span>
    <span><i style="background:#2fae7a"></i>Sales</span>
    <span><i style="background:#8b6fd6"></i>Sales Manager</span>
    <span><i class="flowdot"></i>Luồng xử lý</span>
  </div>
  <p class="hint">Di chuột lên một ô để hiện tay cầm: góc trên-trái (⠿) để kéo cả ô, góc dưới-phải để kéo đổi kích thước. Ô tự canh theo lưới cho gọn.</p>

  <div class="stage"><div class="canvas" id="canvas"></div></div>

<script>
const PALETTE = ['purple','blue','rust','teal','gray'];
const KEY = 'crm_actor_v2';
const CW = 820, CH = 620;
const TRI = '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M12 2 L12 12 L2 12 Z" fill="currentColor" opacity=".55"/></svg>';

const defaultState = {
  nodes: [
    {id:'dangky', title:'Tiếp nhận đăng ký lái thử', sub:'Website (khách tự nhập) · CRM (Sales nhập hộ)', color:'teal', x:310, y:40, w:200, h:70},
    {id:'nurture',title:'Nuôi dưỡng khách hàng',sub:'Marketing tự động + CSKH đa kênh (Zalo · Tele · Email)',color:'rust',x:310,y:144,w:200, h:70},
    {id:'quote',  title:'Tư vấn · báo giá',    sub:'Gói pin & tài chính',             color:'teal', x:310, y:248,w:200, h:62},
    {id:'deal',   title:'Chốt deal',           sub:'Ký hợp đồng · bàn giao',          color:'teal', x:310, y:344,w:200, h:62},
    {id:'dash',   title:'Dashboard chi nhánh', sub:'Doanh thu · tỉ lệ chốt',          color:'gray', x:310, y:460,w:200, h:62},
  ],
  actors: [
    {id:'customer', name:'Customer',      role:'Khách hàng',         accent:'#e0954a', x:110, y:71},
    {id:'sales',    name:'Sales',         role:'Nhân viên bán hàng', accent:'#2fae7a', x:710, y:270},
    {id:'manager',  name:'Sales Manager', role:'Quản lý số liệu',    accent:'#8b6fd6', x:710, y:483},
  ],
  notes: []
};

// Tài liệu chi tiết của từng module (mở bằng nút ↗ trên mỗi ô)
const MODULE_LINKS = {
  dangky:  'module-1-dang-ky-lai-thu.html',
  nurture: 'module-2-marketing-automation.html',
  quote:   'module-3-tu-van-bao-gia.html',
  deal:    'module-4-chot-deal.html',
  dash:    'module-5-dashboard-chi-nhanh.html'
};

const flowLinks = [
  {from:'dangky',to:'nurture'},
  {from:'nurture',to:'quote'},{from:'quote',to:'deal'},{from:'deal',to:'dash',dashed:true}
];
const actorLinks = [
  {a:'customer',n:'dangky'},
  {a:'sales',n:'dangky'},{a:'sales',n:'nurture'},{a:'sales',n:'quote'},{a:'sales',n:'deal'},
  {a:'manager',n:'dash'}
];

let state = clone(defaultState);
let drag = null;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const snap = v => Math.round(v/5)*5;
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const nodeById  = id => state.nodes.find(n=>n.id===id);
const actorById = id => state.actors.find(a=>a.id===id);
const noteById  = id => state.notes.find(n=>n.id===id);
const getObj = (k,id) => k==='actor'?actorById(id) : k==='note'?noteById(id) : nodeById(id);
const elemFor = (k,id) => document.querySelector(
  k==='actor'?`.actor[data-id="${id}"]` : k==='note'?`.note[data-id="${id}"]` : `.card[data-id="${id}"]`);

const canvas = document.getElementById('canvas');
canvas.innerHTML = `<svg id="wires" class="wires" viewBox="0 0 ${CW} ${CH}" width="${CW}" height="${CH}"></svg><div id="layer"></div>`;
const layer = document.getElementById('layer');

function stick(c){
  return `<svg viewBox="0 0 24 42" width="30" height="52" aria-hidden="true">
    <circle cx="12" cy="7" r="5.5" fill="none" stroke="${c}" stroke-width="2"/>
    <line x1="12" y1="12.5" x2="12" y2="27" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="20" y2="18" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="27" x2="5" y2="39" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="27" x2="19" y2="39" stroke="${c}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function renderCards(){
  let h = '';
  state.nodes.forEach(n => {
    h += `<div class="card c-${n.color}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${n.h}px">
      <span class="drag-handle" data-drag data-kind="node" data-id="${n.id}" title="Kéo để di chuyển">⠿</span>
      <button class="cc" data-action="color" data-id="${n.id}" title="Đổi màu">◑</button>
      ${MODULE_LINKS[n.id] ? `<a class="cc" href="${MODULE_LINKS[n.id]}" target="_blank" rel="noopener" title="Mở tài liệu module">↗</a>` : ''}
      <div class="t" contenteditable="true" data-kind="node" data-id="${n.id}" data-field="title">${esc(n.title)}</div>
      <div class="s" contenteditable="true" data-kind="node" data-id="${n.id}" data-field="sub">${esc(n.sub)}</div>
      <span class="resize-handle" data-resize data-kind="node" data-id="${n.id}" title="Kéo góc để đổi cỡ">${TRI}</span>
    </div>`;
  });
  state.actors.forEach(a => {
    h += `<div class="actor" data-id="${a.id}" style="left:${a.x-60}px;top:${a.y-26}px">
      <span class="actor-grip" data-drag data-kind="actor" data-id="${a.id}" title="Kéo để di chuyển">${stick(a.accent)}</span>
      <div class="an" contenteditable="true" data-kind="actor" data-id="${a.id}" data-field="name" style="color:${a.accent}">${esc(a.name)}</div>
      <div class="ar" contenteditable="true" data-kind="actor" data-id="${a.id}" data-field="role">${esc(a.role)}</div>
    </div>`;
  });
  state.notes.forEach(nt => {
    h += `<div class="note" data-id="${nt.id}" style="left:${nt.x}px;top:${nt.y}px;width:${nt.w}px;min-height:${nt.h}px">
      <span class="drag-handle" data-drag data-kind="note" data-id="${nt.id}" title="Kéo để di chuyển">⠿</span>
      <button class="del" data-action="delnote" data-id="${nt.id}" title="Xóa ghi chú">✕</button>
      <div class="nt" contenteditable="true" data-kind="note" data-id="${nt.id}" data-field="text">${esc(nt.text)}</div>
      <span class="resize-handle" data-resize data-kind="note" data-id="${nt.id}" title="Kéo góc để đổi cỡ">${TRI}</span>
    </div>`;
  });
  layer.innerHTML = h;
}

function renderWires(){
  let s = `<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3d7ec0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>`;

  actorLinks.forEach(l => {
    const ac = elemFor('actor', l.a), nd = elemFor('node', l.n); if(!ac || !nd) return;
    const acx = ac.offsetLeft + ac.offsetWidth/2, acy = ac.offsetTop + 26;
    const ndx = nd.offsetLeft, ndy = nd.offsetTop, ndw = nd.offsetWidth, ndh = nd.offsetHeight;
    const side = acx < ndx + ndw/2 ? 'left' : 'right';
    const fx = acx + (side==='left' ? 28 : -28), fy = acy;
    const tx = side==='left' ? ndx : ndx + ndw, ty = ndy + ndh/2;
    const col = actorById(l.a).accent;
    s += `<line x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" stroke="${col}" stroke-width="1.6" opacity="0.62"/>`;
    s += `<circle cx="${tx}" cy="${ty}" r="3.2" fill="${col}"/>`;
  });

  flowLinks.forEach(fl => {
    const a = elemFor('node', fl.from), b = elemFor('node', fl.to); if(!a || !b) return;
    const x1 = a.offsetLeft + a.offsetWidth/2, y1 = a.offsetTop + a.offsetHeight;
    const x2 = b.offsetLeft + b.offsetWidth/2, y2 = b.offsetTop;
    const ang = Math.atan2(y2 - y1, x2 - x1), gap = 7;
    const ex = x2 - Math.cos(ang)*gap, ey = y2 - Math.sin(ang)*gap;
    if (fl.dashed)
      s += `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="#3d7ec0" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ahb)"/>`;
    else
      s += `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>`;
  });

  document.getElementById('wires').innerHTML = s;
}

function render(){ renderCards(); renderWires(); }

function setPos(kind, el, o){
  if (kind==='actor'){ el.style.left=(o.x-60)+'px'; el.style.top=(o.y-26)+'px'; }
  else { el.style.left=o.x+'px'; el.style.top=o.y+'px'; }
}

// ---------- edit text (no re-render, keeps caret) ----------
layer.addEventListener('input', e => {
  const el = e.target.closest('[data-field]'); if(!el) return;
  const o = getObj(el.dataset.kind, el.dataset.id);
  if (o) o[el.dataset.field] = el.textContent;
  saveSoon();
});
layer.addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.classList.contains('nt')) return;      // notes allow multiline
  if (e.key==='Enter' && e.target.hasAttribute('contenteditable')){ e.preventDefault(); e.target.blur(); }
});

// ---------- buttons ----------
layer.addEventListener('click', e => {
  const col = e.target.closest('button[data-action="color"]');
  const dn  = e.target.closest('button[data-action="delnote"]');
  if (col){ const n = nodeById(col.dataset.id); n.color = PALETTE[(PALETTE.indexOf(n.color)+1)%PALETTE.length]; render(); saveSoon(); }
  else if (dn){ state.notes = state.notes.filter(x=>x.id!==dn.dataset.id); render(); saveSoon(); }
});

// ---------- nhấp đúp vào ô để mở tài liệu module ----------
layer.addEventListener('dblclick', e => {
  if (e.target.closest('[contenteditable]')) return;   // chừa chỗ đang sửa chữ
  const card = e.target.closest('.card'); if(!card) return;
  const url = MODULE_LINKS[card.dataset.id]; if(!url) return;
  window.open(url, '_blank', 'noopener');
});

// ---------- drag & resize ----------
canvas.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-drag],[data-resize]'); if(!t) return;
  const kind = t.dataset.kind, id = t.dataset.id, o = getObj(kind, id); if(!o) return;
  e.preventDefault();
  drag = { isResize: t.hasAttribute('data-resize'), kind, id, el: elemFor(kind, id),
           sx: e.clientX, sy: e.clientY, ox: o.x, oy: o.y, ow: o.w||0, oh: o.h||0 };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp, { once:true });
});
function onMove(e){
  if(!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, o = getObj(drag.kind, drag.id);
  if (drag.isResize){
    o.w = snap(clamp(drag.ow + dx, 120, CW - o.x));
    o.h = snap(Math.max(44, drag.oh + dy));
    drag.el.style.width = o.w + 'px';
    drag.el.style.minHeight = o.h + 'px';
  } else if (drag.kind==='actor'){
    o.x = snap(clamp(drag.ox + dx, 60, CW - 60));
    o.y = snap(clamp(drag.oy + dy, 30, CH - 40));
    setPos('actor', drag.el, o);
  } else {
    o.x = snap(clamp(drag.ox + dx, 0, CW - o.w));
    o.y = snap(clamp(drag.oy + dy, 0, CH - o.h));
    setPos(drag.kind, drag.el, o);
  }
  renderWires();
}
function onUp(){ window.removeEventListener('pointermove', onMove); drag = null; saveSoon(); }

// ---------- toolbar ----------
document.getElementById('addnote').onclick = () => {
  state.notes.push({ id:'n'+Date.now(), text:'Ghi chú...', x:40, y:40, w:170, h:70 });
  render(); saveSoon();
};
document.getElementById('print').onclick = () => window.print();
document.getElementById('reset').onclick = () => {
  if (confirm('Đặt lại về sơ đồ gốc? Mọi chỉnh sửa, vị trí và ghi chú sẽ mất.')){ state = clone(defaultState); render(); saveSoon(); }
};

// ---------- persistence ----------
let t = null;
function saveSoon(){ clearTimeout(t); t = setTimeout(save, 400); }
async function save(){ try{ if(window.storage) await window.storage.set(KEY, JSON.stringify(state), false); }catch(_){}}
function migrate(){
  state.nodes.forEach(n => { if(n.w==null) n.w=200; if(n.h==null) n.h=62; });
  if(!Array.isArray(state.notes)) state.notes = [];
}
async function boot(){
  try{ if(window.storage){ const r = await window.storage.get(KEY, false); if(r && r.value) state = JSON.parse(r.value); } }catch(_){}
  migrate();
  render();
}
boot();
</script>
</body>
</html>
